version: '3.9'

services:

  tasktracker-projects:
    build: ./TaskTracker.Projects
    ports:
      - "5001:5001"

  tasktracker-users:
    build: ./TaskTracker.Users
    ports:
      - "5002:5002"

  #tasktracker-comments:
    #build: ./TaskTracker.Comments
    #ports:
    #  - "5003:5003"

  postgres:
    image: postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: taskdb
    ports:
      - "5432:5432"

  redis:
    image: redis
    ports:
      - "6379:6379"