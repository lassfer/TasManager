name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # - name: Run tests
      #   run: npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Main Docker Image
        run: docker build -t tasktracker-main .

      - name: Build Users Docker Image
        run: docker build -t tasktracker-users ./TaskTracker.Users

      - name: Build Comments Docker Image
        run: docker build -t tasktracker-comments ./TaskTracker.Comments

      - name: Start Infrastructure
        run: docker compose up -d
