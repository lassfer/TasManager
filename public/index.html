<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker Pro UI</title>
    <!-- Шрифты и иконки -->
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://jsdelivr.net">
    <link href="https://jsdelivr.net" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .premium-card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            width: 100%;
            max-width: 550px; /* Жестко ограничиваем ширину, чтобы не растягивалось на весь экран */
            padding: 30px;
        }
        .form-control, .form-select {
            background-color: #1f2937;
            border: 1px solid #374151;
            color: #ffffff;
            border-radius: 8px;
            padding: 10px 12px;
        }
        .form-control:focus, .form-select:focus {
            background-color: #1f2937;
            border-color: #6366f1;
            color: #ffffff;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
        }
        .btn-gradient {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            border: none;
            color: white;
            font-weight: 600;
            border-radius: 8px;
            padding: 14px;
            transition: all 0.2s ease;
        }
        .btn-gradient:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }
        .status-badge {
            border-radius: 12px;
            padding: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid transparent;
        }
        .status-idle { background: #1f2937; border-color: #374151; color: #9ca3af; }
        .status-wait { background: rgba(245, 158, 11, 0.1); border-color: #f59e0b; color: #fbbf24; }
        .status-success { background: rgba(16, 185, 129, 0.1); border-color: #10b981; color: #34d399; }
        .status-fail { background: rgba(239, 68, 68, 0.1); border-color: #ef4444; color: #f87171; }
        pre {
            background-color: #030712 !important;
            border: 1px solid #1f2937;
            border-radius: 8px;
            max-height: 200px;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="premium-card">
        <!-- Шапка панели -->
        <div class="text-center mb-4">
            <div class="d-inline-flex p-3 rounded-circle mb-3" style="background: rgba(99, 102, 241, 0.1);">
                <i class="bi bi-cpu" style="font-size: 2rem; color: #818cf8;"></i>
            </div>
            <h3 class="fw-bold text-white mb-1">Task Tracker Pro</h3>
            <p class="text-muted small mb-0">Интеграционный слой управления оркестрацией (Saga)</p>
        </div>

        <!-- Форма команд -->
        <form id="taskForm" class="mb-4">
            <div class="mb-3">
                <label class="form-label text-secondary small fw-semibold">НАЗВАНИЕ НОВОЙ ЗАДАЧИ</label>
                <input type="text" class="form-control" id="taskTitle" value="Реализовать этап 8 лабораторной" required>
            </div>
            <div class="mb-4">
                <label class="form-label text-secondary small fw-semibold">РЕЖИМ СКВОЗНОГО ПРОЦЕССА</label>
                <select class="form-select" id="scenarioType">
                    <option value="success">💎 Успешный сценарий (New → In Progress → Done)</option>
                    <option value="fail">⚠️ Сбойный сценарий (Вызов отката Саги / Cancelled)</option>
                </select>
            </div>
            <button type="submit" class="btn btn-gradient w-100">
                <i class="bi bi-play-fill me-1"></i> Запустить оркестрацию
            </button>
        </form>

        <!-- Мониторинг статуса -->
        <div class="mb-4">
            <label class="form-label text-secondary small fw-semibold mb-2">МОНИТОРИНГ ИНТЕГРАЦИИ</label>
            <div id="statusAlert" class="status-badge status-idle">
                <i class="bi bi-hourglass-split"></i>
                <span>Система готова к приему команд...</span>
            </div>
        </div>

        <!-- Вывод JSON -->
        <div id="responseBlock" class="d-none">
            <label class="form-label text-secondary small fw-semibold mb-2">ОТВЕТ СЕРВЕРА (JSON RESULT)</label>
            <pre id="jsonResult" class="text-info p-3 m-0 rounded overflow-auto" style="color: #38bdf8 !important;"></pre>
        </div>
    </div>

    <script>
        document.getElementById('taskForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const titleInput = document.getElementById('taskTitle').value;
            const scenario = document.getElementById('scenarioType').value;
            const statusAlert = document.getElementById('statusAlert');
            const responseBlock = document.getElementById('responseBlock');
            const jsonResult = document.getElementById('jsonResult');

            statusAlert.className = "status-badge status-wait";
            statusAlert.innerHTML = `<div class="spinner-border spinner-border-sm" role="status"></div><span>⏳ Выполнение шагов Саги: Проверка лимитов...</span>`;

            const finalTitle = scenario === 'fail' ? 'bad_task' : titleInput;

            try {
                const response = await fetch('/tasks/process-saga', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title: finalTitle, userId: 1 })
                });

                const result = await response.json();
                
                responseBlock.classList.remove('d-none');
                jsonResult.innerText = JSON.stringify(result, null, 2);

                if (response.ok) {
                    statusAlert.className = "status-badge status-success";
                    statusAlert.innerHTML = `<i class="bi bi-check-circle-fill"></i><span>Процесс завершен! Статус в БД: <b>Done</b></span>`;
                } else {
                    statusAlert.className = "status-badge status-fail";
                    statusAlert.innerHTML = `<i class="bi bi-exclamation-triangle-fill"></i><span>Сага отработала откат (Compensated). Причина: ${result.reason}</span>`;
                }
            } catch (err) {
                statusAlert.className = "status-badge status-fail";
                statusAlert.innerHTML = `<i class="bi bi-x-circle-fill"></i><span>Критическая ошибка сети</span>`;
            }
        });
    </script>
</body>
</html>
